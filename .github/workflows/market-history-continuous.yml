name: Market history recovery

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ge-flip-market-history-recovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OSRS_USER_AGENT: "GE Flip Companion - AntonioDitcharo on GitHub"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/backfill-market-history.mjs --timestep=5m --limit=100 --concurrency=2 --delay-ms=350
      - run: node scripts/evaluate-model-items.mjs --timestep=5m
      - run: node scripts/validate-ml-dataset.mjs
      - if: always()
        run: node scripts/market-history-status.mjs
